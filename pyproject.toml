[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pydash"
version = "8.1.0"
description = "pydash 8.1.0 with a cached path parser (opt-lab build)"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["typing-extensions"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
